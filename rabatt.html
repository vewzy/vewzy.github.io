<!DOCTYPE html>
<html>
<head>
	<title>Rabatträknare</title>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
</head>
<body>

<div id="maincontainer">

<h1>Rabatträknare</h1>

<div id="priscontainer">
	<p> Pris <input id="pris" type="number" inputmode="numeric"/> € </p>
</div>


<div id="rabattcontainer">
	<p>Rabatt <input id="rabatt" type="number" inputmode="numeric"/> % </p>
</div>

<p> <button id="calcrabatt" onclick="calculate_rabatt()">OK</button> </p>

<p id="outp">Det rabatterade priset kommer att visas här.</p>

<p>Notera: Det rabatterade priset beräknas med 
	<p>p*(1-r/100), </p>
var p är priset och r är rabattprocenten.</p>

<p>Notera: Det rabatterades priset är avrundat till två decimaler.</p>

</body>
<style>

#knappsats {
	display: grid;
	grid-template-columns: auto auto auto;
	/* padding: 10px; */
	/* width: 100%; */
}

#knappsats > div {
	background-color: rgba(0, 0, 0, 0.09);
	/* padding 20px; */
	border: 1px solid black;
	border-radius: 4px;
	font-size: 40px;
	text-align: center;
	margin: 10px;
}

#knappsats > div:active {
	background-color: white;
}

#maincontainer {
	max-width: 550px;
	text-align: center;
	display: inline-block;
}

* {
	font-family: sans-serif;
	touch-action: manipulation;
	text-align: center;
}

#outp {
	font-size: 30px;
}

input {
	font-size: 24px;
	background: none;
	padding: 0px;
}

#rabattcontainer {
	font-size: 24px;
	width: 100%;
}

#priscontainer {
	font-size: 24px;
	width: 100%
}

#calcrabatt {
	width: 300px;
	height: 100px;
	font-size: 40px;
	background-color: rgba(200, 240, 100, 1);
	border-radius: 10px;
	color: white;
}

</style>
<script type="text/javascript">

function calculate_rabatt () {
	var pris = document.getElementById("pris").value;
	var rabatt = document.getElementById("rabatt").value;
	var p = parseFloat(pris);
	var r = parseFloat(rabatt);

	var rpris = p*(1-r/100);

	var outp = "Det rabatterade priset är " + rpris.toFixed(2) + "€.";
	document.getElementById("outp").innerHTML = outp;
}

</script>
</html>
